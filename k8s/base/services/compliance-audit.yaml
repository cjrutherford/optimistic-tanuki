apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-audit
  namespace: optimistic-tanuki
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compliance-audit
  template:
    metadata:
      labels:
        app: compliance-audit
    spec:
      containers:
        - name: compliance-audit
          image: cjrutherford/optimistic_tanuki_compliance-audit:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3025
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '3025'
            - name: POSTGRES_HOST
              value: 'postgres'
            - name: POSTGRES_PORT
              value: '5432'
            - name: POSTGRES_DB
              value: 'ot_compliance_audit'
            - name: LISTEN_PORT
              value: '3025'
          envFrom:
            - secretRef:
                name: optimistic-tanuki-secrets
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          livenessProbe:
            tcpSocket:
              port: 3025
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3025
            initialDelaySeconds: 10
            periodSeconds: 5
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-audit
  namespace: optimistic-tanuki
spec:
  selector:
    app: compliance-audit
  ports:
    - port: 3025
      targetPort: 3025
  clusterIP: None
