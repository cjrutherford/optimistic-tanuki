apiVersion: v1
kind: ConfigMap
metadata:
  name: security-loki-config
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      filesystem:
        chunks_directory: /loki/chunks
        rules_directory: /loki/rules
    limits_config:
      retention_period: 168h
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: security-loki-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: security-loki
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app: security-loki
  template:
    metadata:
      labels:
        app: security-loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.1.1
          args: ['-config.file=/etc/loki/config.yaml']
          ports:
            - containerPort: 3100
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: security-loki-config
        - name: data
          persistentVolumeClaim:
            claimName: security-loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector:
    app: security-loki
  ports:
    - name: http
      port: 3100
      targetPort: http
