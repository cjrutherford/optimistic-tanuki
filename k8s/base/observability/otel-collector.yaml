apiVersion: v1
kind: ConfigMap
metadata:
  name: security-otel-collector-config
data:
  config.yaml: |
    receivers:
      filelog/ingress:
        include:
          - /var/log/pods/ingress-nginx_controller-*.log
        start_at: end
        operators:
          - type: json_parser
            parse_from: body
            parse_to: attributes
      syslog/manual-nginx:
        udp:
          listen_address: 0.0.0.0:514
      otlp:
        protocols:
          grpc: {}
          http: {}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
      batch: {}
      resource:
        attributes:
          - key: deployment.environment
            value: production
            action: upsert
          - key: service.name
            value: public-edge
            action: upsert
      transform/classification:
        log_statements:
          - context: log
            statements:
              - set(attributes["classification"], "unsupported_url") where attributes["status"] == 404
              - set(attributes["classification"], "denied") where attributes["status"] == 401 or attributes["status"] == 403
              - set(attributes["classification"], "rate_limited") where attributes["status"] == 429
    exporters:
      otlphttp/loki:
        endpoint: http://loki:3100/otlp
      prometheus:
        endpoint: 0.0.0.0:8889
    service:
      pipelines:
        logs:
          receivers: [filelog/ingress, syslog/manual-nginx, otlp]
          processors: [memory_limiter, resource, transform/classification, batch]
          exporters: [otlphttp/loki]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: security-otel-collector
spec:
  selector:
    matchLabels:
      app: security-otel-collector
  template:
    metadata:
      labels:
        app: security-otel-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.107.0
          args: ['--config=/etc/otel/config.yaml']
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 8889
              name: metrics
            - containerPort: 514
              name: syslog-udp
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: security-otel-collector-config
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector:
    app: security-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: metrics
      port: 8889
      targetPort: metrics
    - name: syslog-udp
      port: 514
      protocol: UDP
      targetPort: syslog-udp
