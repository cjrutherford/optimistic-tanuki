apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://security-prometheus:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: optimistic-tanuki
        orgId: 1
        folder: Optimistic Tanuki
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-edge-security
  labels:
    app: grafana
    grafana_dashboard: '1'
data:
  edge-security.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 0,
      "panels": [
        {"datasource": {"type": "loki", "uid": "loki"}, "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0}, "id": 1, "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "sum(count_over_time({service_name=\"public-edge\"}[5m]))", "refId": "A"}], "title": "Edge requests (5m)", "type": "stat"},
        {"datasource": {"type": "loki", "uid": "loki"}, "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0}, "id": 2, "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "sum(count_over_time({service_name=\"public-edge\"} |= \"\\\"classification\\\":\\\"denied\\\"\" [5m]))", "refId": "A"}], "title": "Denied requests (5m)", "type": "stat"},
        {"datasource": {"type": "loki", "uid": "loki"}, "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0}, "id": 3, "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "sum(count_over_time({service_name=\"public-edge\"} |= \"\\\"classification\\\":\\\"rate_limited\\\"\" [5m]))", "refId": "A"}], "title": "Rate-limited requests (5m)", "type": "stat"},
        {"datasource": {"type": "loki", "uid": "loki"}, "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8}, "id": 4, "options": {"legend": {"displayMode": "table", "placement": "right", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "sum by (host) (count_over_time({service_name=\"public-edge\"} |= \"\\\"classification\\\":\\\"unsupported_url\\\"\" [5m]))", "legendFormat": "{{host}}", "refId": "A"}], "title": "Unsupported URL probes by host", "type": "timeseries"},
        {"datasource": {"type": "loki", "uid": "loki"}, "gridPos": {"h": 8, "w": 16, "x": 8, "y": 8}, "id": 5, "options": {"dedupStrategy": "none", "enableLogDetails": true, "prettifyJSON": true, "showCommonLabels": false, "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true}, "targets": [{"expr": "{service_name=\"public-edge\"} |= \"\\\"classification\\\":\\\"denied\\\"\"", "refId": "A"}], "title": "Recent denied edge requests", "type": "logs"}
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["security", "edge", "otel"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "title": "Edge Security",
      "uid": "tanuki-edge-security",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gateway-traffic
  labels:
    app: grafana
    grafana_dashboard: '1'
data:
  gateway-traffic.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 0,
      "panels": [
        {"datasource": {"type": "loki", "uid": "loki"}, "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}, "id": 1, "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "sum(rate({service_name=\"public-edge\"}[5m]))", "legendFormat": "requests/sec", "refId": "A"}], "title": "Gateway request rate", "type": "timeseries"},
        {"datasource": {"type": "loki", "uid": "loki"}, "fieldConfig": {"defaults": {"unit": "percentunit"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}, "id": 2, "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "sum(rate({service_name=\"public-edge\"} | json | status=~\"5..\" [5m])) / sum(rate({service_name=\"public-edge\"}[5m]))", "legendFormat": "5xx ratio", "refId": "A"}], "title": "Gateway 5xx ratio", "type": "timeseries"},
        {"datasource": {"type": "loki", "uid": "loki"}, "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}, "id": 3, "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "quantile_over_time(0.95, {service_name=\"public-edge\"} | json | unwrap duration [5m])", "legendFormat": "p95", "refId": "A"}, {"expr": "avg_over_time({service_name=\"public-edge\"} | json | unwrap duration [5m])", "legendFormat": "average", "refId": "B"}], "title": "Gateway latency", "type": "timeseries"},
        {"datasource": {"type": "loki", "uid": "loki"}, "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}, "id": 4, "options": {"legend": {"displayMode": "table", "placement": "right", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "sum by (path) (count_over_time({service_name=\"public-edge\"} | json | status=~\"5..\" [15m]))", "legendFormat": "{{path}}", "refId": "A"}], "title": "5xx responses by path", "type": "timeseries"}
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["gateway", "latency", "errors", "otel"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "title": "Gateway Traffic, Latency & Errors",
      "uid": "tanuki-gateway-traffic",
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform-health
  labels:
    app: grafana
    grafana_dashboard: '1'
data:
  platform-health.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 0,
      "panels": [
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"mappings": [{"options": {"0": {"color": "red", "index": 0, "text": "Down"}, "1": {"color": "green", "index": 1, "text": "Up"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0}, "id": 1, "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "min(up{job=\"security-otel-collector\"})", "refId": "A"}], "title": "OTel Collector scrape health", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0}, "id": 2, "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "sum(up{job=\"security-otel-collector\"})", "refId": "A"}], "title": "Collector targets up", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}, "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0}, "id": 3, "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"}, "targets": [{"expr": "max(scrape_duration_seconds{job=\"security-otel-collector\"})", "refId": "A"}], "title": "Slowest collector scrape", "type": "stat"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}, "id": 4, "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "sum(rate(otelcol_exporter_sent_log_records[5m]))", "legendFormat": "sent", "refId": "A"}, {"expr": "sum(rate(otelcol_exporter_send_failed_log_records[5m]))", "legendFormat": "failed", "refId": "B"}], "title": "Log export throughput and failures", "type": "timeseries"},
        {"datasource": {"type": "prometheus", "uid": "prometheus"}, "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}, "id": 5, "options": {"legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}}, "targets": [{"expr": "sum(rate(otelcol_receiver_accepted_log_records[5m]))", "legendFormat": "accepted logs", "refId": "A"}, {"expr": "sum(rate(otelcol_receiver_refused_log_records[5m]))", "legendFormat": "refused logs", "refId": "B"}], "title": "Collector ingestion capacity", "type": "timeseries"}
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["platform", "health", "capacity", "otel"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "title": "Platform Health & Capacity",
      "uid": "tanuki-platform-health",
      "version": 1
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: 'false'
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'false'
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: edge-security-dashboard
              mountPath: /var/lib/grafana/dashboards/edge-security.json
              subPath: edge-security.json
              readOnly: true
            - name: gateway-traffic-dashboard
              mountPath: /var/lib/grafana/dashboards/gateway-traffic.json
              subPath: gateway-traffic.json
              readOnly: true
            - name: platform-health-dashboard
              mountPath: /var/lib/grafana/dashboards/platform-health.json
              subPath: platform-health.json
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: edge-security-dashboard
          configMap:
            name: grafana-dashboard-edge-security
        - name: gateway-traffic-dashboard
          configMap:
            name: grafana-dashboard-gateway-traffic
        - name: platform-health-dashboard
          configMap:
            name: grafana-dashboard-platform-health
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
