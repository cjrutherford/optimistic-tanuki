            }
          ],
          "title": "Assessment submissions",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "sum(max by (event, path, detail, utm_source, utm_medium, utm_campaign) (increase(ot_site_events_total{app=\"hai\",event=\"page_view\",path=\"/private-cloud/open-source-stack\"}[$__range])))",
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Open-source stack visits",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 5
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "sum(max by (event, path, detail, utm_source, utm_medium, utm_campaign) (increase(ot_site_events_total{app=\"hai\",event=\"phone_click\"}[$__range])))",
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Phone clicks",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
