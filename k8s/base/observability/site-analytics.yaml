apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-site-analytics
  labels:
    app: grafana
    grafana_dashboard: '1'
data:
  site-analytics.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "sum(max by (event, path, detail, utm_source, utm_medium, utm_campaign) (increase(ot_site_events_total{app=\"hai\",event=\"page_view\",path=\"/private-cloud\"}[$__range])))",
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Private-cloud landing visits",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
