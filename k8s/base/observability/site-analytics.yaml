          },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "sum(max by (event, path, detail, utm_source, utm_medium, utm_campaign) (increase(ot_site_events_total{app=\"hai\",event=\"email_click\"}[$__range])))",
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Email clicks",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "id": 7,
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Value"
              }
            ]
          },
          "targets": [
            {
              "expr": "max by (event, detail) (increase(ot_site_events_total{app=\"hai\",event=~\"audience_interest|assessment_submit\"}[$__range]))",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ],
          "title": "Home vs organization interest",
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "id": 8,
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Value"
              }
            ]
          },
          "targets": [
            {
              "expr": "max by (path) (increase(ot_site_events_total{app=\"hai\",event=\"page_view\"}[$__range]))",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ],
          "title": "Page views by path",
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 10
          },
          "id": 9,
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Value"
              }
            ]
          },
          "targets": [
            {
              "expr": "max by (path, detail) (increase(ot_site_events_total{app=\"hai\",event=\"cta_click\"}[$__range]))",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ],
          "title": "Calls to action by page",
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 19
          },
          "id": 10,
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Value"
              }
            ]
          },
          "targets": [
            {
              "expr": "max by (utm_source, utm_medium, utm_campaign, event) (increase(ot_site_events_total{app=\"hai\",utm_source!=\"\"}[$__range]))",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ],
          "title": "Campaigns (UTM)",
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 28
          },
          "id": 11,
          "targets": [
            {
              "expr": "max by (event) (sum by (event, instance) (increase(ot_site_events_total{app=\"hai\"}[1h])))",
              "legendFormat": "{{event}}",
              "refId": "A"
            }
          ],
          "title": "Events per hour",
          "type": "timeseries"
        }
      ],
      "refresh": "5m",
      "schemaVersion": 39,
      "tags": [
        "hai",
        "analytics"
      ],
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "title": "HAI site analytics",
      "uid": "hai-site-analytics",
      "version": 1,
      "description": "Aggregate, cookieless site events from /api/analytics/events. Counts live in Redis; each gateway replica exposes the same totals, so panels take max across instances."
    }
