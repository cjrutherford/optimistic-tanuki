            },
            "textMode": "value"
          },
          "targets": [
            {
              "expr": "sum(max by (event, path, detail, utm_source, utm_medium, utm_campaign) (increase(ot_site_events_total{app=\"hai\",event=\"assessment_start\"}[$__range])))",
