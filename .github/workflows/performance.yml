name: Performance Testing

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_lighthouse:
        description: Run Lighthouse audits
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Load testing runs in ci-cd.yml (load_performance), after image_check has
  # built this run's images, so it tests the change rather than :latest.
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_lighthouse == 'true'
    timeout-minutes: 30

    strategy:
      matrix:
        app:
          - digital-homestead
          - owner-console
          - forgeofwill
          - business-site
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.app }}
        run: pnpm exec nx build ${{ matrix.app }} --configuration=production
        env:
          CI: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start application
        run: |
          # Build image directly from app Dockerfile
          docker build \
            -f apps/${{ matrix.app }}/Dockerfile \
            -t ot-${{ matrix.app }}:ci \
            .
          # Run container mapping host port 4200 to container port 4000 (SSR apps expose 4000)
          docker run -d --name app-${{ matrix.app }} \
            -p 4200:4000 \
            -e NODE_ENV=production \
            ot-${{ matrix.app }}:ci

          # Wait for app to be ready
          echo "Waiting for app to be available on port 4200..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4200 > /dev/null 2>&1; then
              echo "App is ready."
              break
            fi
            echo "Attempt $i/30 - not ready yet, waiting 3s..."
            sleep 3
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4200
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Stop application
        if: always()
        run: docker rm -f app-${{ matrix.app }} 2>/dev/null || true
