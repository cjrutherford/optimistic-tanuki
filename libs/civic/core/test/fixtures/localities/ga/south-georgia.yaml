slug: south-georgia
name: South Georgia
state: GA
timezone: America/New_York
lat: 31.4
lon: -83.4
kind: region
parents: [georgia]
broad: true
topics: [health, regional-news, weather]
sources:
  - sourceKey: south-health-district
    adapter: rss
    name: South Health District
    url: https://southhealthdistrict.com/feed/
    kind: news
    desk: public-safety
    accessMode: full
    aggregateDiscovery: false
    coverageCapabilities:
      # A few posts a week: twelve pages reach six months on a first run.
      pagination: { mode: page, parameter: paged, maxPages: 12, untilCovered: true }
  - sourceKey: south-georgia-news-discover
    # Disabled 2026-09-21: news.google.com's robots.txt disallows crawlers,
    # and this adapter discovers only through Google News search. Publishers'
    # own sitemaps, feeds and search feeds carry discovery instead.
    enabled: false
    adapter: news-discover
    name: South Georgia regional news
    url: https://news.google.com/rss/search?q=South+Georgia+news
    kind: news
    desk: local-reporting
    accessMode: full
    aggregateDiscovery: true
    aggregateUrl: https://news.google.com/rss/search?q=South+Georgia+news
    config:
      query: South Georgia news
      matchNames: [South Georgia, Adel, Nashville, Tifton, Cook County, Berrien County, Tift County]
      excludePublishers: [The Georgia Gazette]
  - sourceKey: valdosta-today
    adapter: rss
    name: Valdosta Today
    url: https://valdostatoday.com/feed/
    kind: news
    desk: local-reporting
    accessMode: full
