<div class="tag-selector">
  <div class="tag-list">
    <div
      *ngFor="let tag of availableTags"
      class="tag-item"
      [class.selected]="isSelected(tag.id)"
      (click)="toggleTag(tag.id)"
      [style.backgroundColor]="
        isSelected(tag.id) ? tag.color || 'var(--primary)' : 'transparent'
      "
      [style.borderColor]="tag.color || 'var(--primary)'"
      [style.color]="
        isSelected(tag.id) ? 'var(--on-primary)' : tag.color || 'var(--primary)'
      "
    >
      {{ tag.name }}
    </div>
  </div>
</div>
