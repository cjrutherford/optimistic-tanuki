<div class="bubble" [class.open]="open">
  @if (open) {
  <div class="panel" role="dialog" aria-label="Assistant">
    <lib-ai-assistant
      [turns]="turns"
      [working]="working"
      [doing]="doing"
      [unavailable]="unavailable"
      [projectName]="projectName"
      [personaName]="personaName"
      (asked)="asked.emit($event)"
      (cleared)="cleared.emit()"
      (changePersona)="showPersonas()"
    ></lib-ai-assistant>
  </div>
  }

  <!--
    The menu is its own overlay, so it is a sibling of the panel rather than
    something inside it. Marking whoever is already open means picking them
    again reads as going back to that thread rather than starting one.
  -->
  @if (choosing) {
  <lib-persona-selection-menu
    [chosenId]="personaId"
    (personaSelected)="choosePersona($event)"
    (menuClose)="hidePersonas()"
  ></lib-persona-selection-menu>
  }

  <button
    type="button"
    class="handle"
    [attr.aria-expanded]="open"
    (click)="toggle()"
  >
    @if (working) {
    <span class="pulse" aria-hidden="true"></span>
    }
    <span class="label">{{ open ? 'Close' : 'Assistant' }}</span>
    @if (!open && unread) {
    <span class="unread">{{ unread }}</span>
    }
  </button>
</div>
