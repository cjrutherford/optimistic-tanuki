@if (toasts().length > 0) {
<div class="message-container" role="status" aria-live="polite">
  @for (toast of toasts(); track toast) {
  <otui-notification
    class="message"
    [notification]="toast"
    [autoDismiss]="0"
    [showProgress]="false"
    animation="slide"
    (dismiss)="dismissMessage($index)"
  />
  }
</div>
}
