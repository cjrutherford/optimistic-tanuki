<div class="register-container">
  <otui-card>
    <div class="card-outer">
      <div class="card-inner">
        <div class="hero" *ngIf="showHero">
          <h1>{{ registerHeader }}</h1>
          <p>{{ callToAction }}</p>
          <img [src]="heroSource" alt="Hero Image" width="300" />
        </div>
        <div class="form">
          <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <lib-text-input
              formControlName="firstName"
              [label]="'First Name'"
              [type]="'text'"
            ></lib-text-input>
            <lib-text-input
              formControlName="lastName"
              [label]="'Last Name'"
              [type]="'text'"
            ></lib-text-input>
            <lib-text-input
              formControlName="email"
              [label]="'Email'"
              [type]="'text'"
            ></lib-text-input>
            <lib-text-input
              formControlName="password"
              [label]="'Password'"
              [type]="'password'"
            ></lib-text-input>
            <lib-text-input
              formControlName="confirmation"
              [label]="'Confirm Password'"
              [type]="'password'"
            ></lib-text-input>
            @if (errorMessage) {
            <p class="auth-error" role="alert">{{ errorMessage }}</p>
            }
            <div class="actions">
              <otui-button
                mat-raised-button
                color="primary"
                type="submit"
                [disabled]="pending"
              >
                {{ pending ? 'Creating account…' : registerButtonText }}
              </otui-button>
            </div>
          </form>
          <lib-oauth-buttons
            *ngIf="showOAuth"
            [enabledProviders]="enabledOAuthProviders"
            (providerSelected)="onOAuthProvider($event)"
          ></lib-oauth-buttons>
        </div>
      </div>
    </div>
  </otui-card>
</div>
