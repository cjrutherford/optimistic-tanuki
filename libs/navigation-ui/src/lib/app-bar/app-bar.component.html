<div
  class="app-bar"
  role="region"
  [attr.aria-label]="appTitle + ' application bar'"
  *ngIf="useTile; else cardTemplate"
>
  <otui-tile style="width: 100%; display: block">
    <div class="title-bar" [class.compact]="isCompact" [class.small]="isSmall">
      <img
        *ngIf="logoSrc"
        [src]="logoSrc"
        [alt]="logoAlt"
        [attr.width]="isSmall ? 40 : isCompact ? 52 : 75"
      />
      <otui-heading
        [text]="appTitle"
        [size]="isSmall ? '1.25em' : isCompact ? '1.5em' : '2em'"
      ></otui-heading>
      <lib-theme-toggle *ngIf="showThemeToggle"></lib-theme-toggle>
      <ng-container *ngTemplateOutlet="actions"></ng-container>
      <otui-button class="menu-btn" (click)="onMenuClick()">{{
        menuIcon
      }}</otui-button>
    </div>
  </otui-tile>
</div>

<ng-template #cardTemplate>
  <div
    class="app-bar"
    role="region"
    [attr.aria-label]="appTitle + ' application bar'"
  >
    <otui-card>
      <div
        class="title-bar"
        [class.compact]="isCompact"
        [class.small]="isSmall"
      >
        <otui-button variant="rounded" (click)="onMenuClick()">
          <img
            *ngIf="logoSrc"
            [src]="logoSrc"
            [alt]="logoAlt"
            [style.maxWidth.px]="isSmall ? 40 : isCompact ? 52 : 75"
            [style.borderRadius]="'50%'"
          />
        </otui-button>
        <h1>{{ appTitle }}</h1>
        <lib-theme-toggle *ngIf="showThemeToggle"></lib-theme-toggle>
        <ng-container *ngTemplateOutlet="actions"></ng-container>
      </div>
    </otui-card>
  </div>
</ng-template>

<!--
  Opt-in actions slot: only children marked [appBarActions] are projected, so
  apps that put other content inside the bar are unaffected.
-->
<ng-template #actions>
  <ng-content select="[appBarActions]"></ng-content>
</ng-template>
