# Docker Compose for Gateway E2E Tests
# Full stack setup for testing gateway with all backend services
services:
  redis:
    image: redis:7-alpine
    container_name: e2e_redis_gateway
    command: redis-server --save '' --appendonly no

  db:
    image: postgres:latest
    restart: always
    container_name: e2e_db_gateway
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  db-setup:
    image: node:24-alpine
    container_name: e2e_db_setup_gateway
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - /workspace/node_modules
    environment:
      CI: 'true'
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
    command: /bin/sh -c "apk add --no-cache postgresql-client && corepack enable && PGPASSWORD=postgres psql -h db -U postgres -c 'CREATE DATABASE ot_lead_tracker;' || true && corepack pnpm run db:setup"
    restart: 'no'

  lead-tracker:
    container_name: e2e_lead_tracker_gw
    build:
      context: ..
      dockerfile: ./apps/lead-tracker/Dockerfile
    ports:
      - '3020:3020'
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ot_lead_tracker
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  authentication:
    container_name: e2e_authentication_gw
    build:
      context: ..
      dockerfile: ./apps/authentication/Dockerfile
    ports:
      - '3001:3001'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: postgres
      POSTGRES_DB: ot_authentication
      AUTH_AUTO_VERIFY_EMAILS: 'true'
      JWT_SECRET: e2e-test-jwt-secret
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  profile:
    container_name: e2e_profile_gw
    build:
      context: ..
      dockerfile: ./apps/profile/Dockerfile
    ports:
      - '3002:3002'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_profile
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  permissions:
    container_name: e2e_permissions_gw
    build:
      context: ..
      dockerfile: ./apps/permissions/Dockerfile
    ports:
      - '3012:3012'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: postgres
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  blogging:
    container_name: e2e_blogging_gw
    build:
      context: ..
      dockerfile: ./apps/blogging/Dockerfile
    ports:
      - '3011:3011'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: postgres
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  social:
    container_name: e2e_social_gw
    build:
      context: ..
      dockerfile: ./apps/social/Dockerfile
    ports:
      - '3003:3003'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_social
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  workspace:
    container_name: e2e_workspace_gw
    build:
      context: ..
      dockerfile: ./apps/workspace/Dockerfile
    ports:
      - '3024:3024'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_workspace
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  gateway:
    container_name: e2e_gateway
    build:
      context: ..
      dockerfile: ./apps/gateway/Dockerfile
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://localhost:3000/api/mcp/sse'', (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }).on(''error'', (err) => process.exit(1));"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: postgres
      NODE_ENV: test
      JWT_SECRET: e2e-test-jwt-secret
      OAUTH_STATE_SECRET: e2e-oauth-state-secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:8084
      AUTHENTICATION_HOST: authentication
      AUTHENTICATION_PORT: 3001
      PROFILE_HOST: profile
      PROFILE_PORT: 3002
      PERMISSIONS_HOST: permissions
      PERMISSIONS_PORT: 3012
      BLOGGING_HOST: blogging
      BLOGGING_PORT: 3011
      SOCIAL_HOST: social
      SOCIAL_PORT: 3003
      WORKSPACE_HOST: workspace
      WORKSPACE_PORT: 3024
      LEAD_TRACKER_HOST: lead-tracker
      LEAD_TRACKER_PORT: 3020
    depends_on:
      db:
        condition: service_healthy
      authentication:
        condition: service_started
      profile:
        condition: service_started
      permissions:
        condition: service_started
      blogging:
        condition: service_started
      social:
        condition: service_started
      workspace:
        condition: service_started
      redis:
        condition: service_started
      lead-tracker:
        condition: service_started
