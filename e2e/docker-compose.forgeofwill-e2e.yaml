# Docker Compose for Forge of Will UI E2E Tests
# Setup for testing forgeofwill with required backend services
services:
  db:
    image: postgres:latest
    restart: always
    container_name: e2e_db_fow
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  db-setup:
    image: node:24-alpine
    container_name: e2e_db_setup_fow
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
    # corepack enable, because node:24-alpine ships corepack without pnpm
    # activated, so this step failed with "pnpm: not found" and took the
    # whole stack with it. video-client is the only compose file here that
    # had this right; nineteen others still do not.
    # verify-deps-before-run off, because this container mounts the host
    # workspace. pnpm checks dependencies before running a script, decides
    # the host node_modules does not match, and tries to purge it. That is
    # the developer's node_modules on the other side of the mount. It also
    # cannot prompt without a TTY, so it aborted and took the stack with it.
    # The setup script installs for itself if node_modules is genuinely absent.
    command: /bin/sh -c "apk add --no-cache postgresql-client && corepack enable && pnpm --config.verify-deps-before-run=false run db:setup"
    restart: 'no'

  authentication:
    container_name: e2e_authentication_fow
    build:
      context: ..
      dockerfile: ./apps/authentication/Dockerfile
    ports:
      - '3001:3001'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_authentication
      JWT_SECRET: e2e-test-jwt-secret
      # Without this no account in this stack can ever sign in. Registration
      # succeeds, login refuses an unverified address, and there is no mail
      # service here to verify one. docker-compose.e2e-stack.yaml already sets
      # it for the same reason.
      AUTH_AUTO_VERIFY_EMAILS: 'true'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const socket=require(''net'').connect(3001, ''127.0.0.1''); socket.setTimeout(2000,()=>process.exit(1)); socket.on(''connect'',()=>process.exit(0)); socket.on(''error'',()=>process.exit(1));"',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  profile:
    container_name: e2e_profile_fow
    build:
      context: ..
      dockerfile: ./apps/profile/Dockerfile
    ports:
      - '3002:3002'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_profile
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const socket=require(''net'').connect(3002, ''127.0.0.1''); socket.setTimeout(2000,()=>process.exit(1)); socket.on(''connect'',()=>process.exit(0)); socket.on(''error'',()=>process.exit(1));"',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  permissions:
    image: cjrutherford/optimistic_tanuki_permissions:${E2E_IMAGE_TAG:-latest}
    container_name: e2e_permissions_fow
    build:
      context: ..
      dockerfile: ./apps/permissions/Dockerfile
    ports:
      - '3012:3012'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_permissions
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const socket=require(''net'').connect(3012, ''127.0.0.1'', () => socket.end(() => process.exit(0))); socket.on(''error'', () => process.exit(1)); setTimeout(() => process.exit(1), 3000);"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  permissions-seed:
    image: cjrutherford/optimistic_tanuki_permissions:${E2E_IMAGE_TAG:-latest}
    container_name: e2e_permissions_seed_fow
    command: ['node', './seed-permissions.js']
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_permissions
    depends_on:
      permissions:
        condition: service_healthy
    restart: 'no'

  social:
    container_name: e2e_social_fow
    build:
      context: ..
      dockerfile: ./apps/social/Dockerfile
    ports:
      - '3003:3003'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_social
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  project-planning:
    container_name: e2e_project_planning_fow
    build:
      context: ..
      dockerfile: ./apps/project-planning/Dockerfile
    ports:
      - '3006:3006'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_project_planning
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const socket=require(''net'').connect(3006, ''127.0.0.1''); socket.setTimeout(2000,()=>process.exit(1)); socket.on(''connect'',()=>process.exit(0)); socket.on(''error'',()=>process.exit(1));"',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  chat-collector:
    container_name: e2e_chat_collector_fow
    build:
      context: ..
      dockerfile: ./apps/chat-collector/Dockerfile
    ports:
      - '3007:3007'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_chat_collector
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  forum:
    container_name: e2e_forum_fow
    build:
      context: ..
      dockerfile: ./apps/forum/Dockerfile
    ports:
      - '3015:3015'
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ot_forum
      PORT: 3015
      SEED_DEMO_DATA: 'true'
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  # The orchestrator keeps conversation state in redis. This stack had none,
  # because nothing in it used a model before now.
  redis:
    image: redis:7-alpine
    container_name: e2e_redis_fow
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  # The AI orchestrator, so the project summary has something to talk to. The
  # stack ran without it, which is why nothing in this app could reach a model.
  # OLLAMA_HOST is the tailnet address rather than the MagicDNS name because
  # containers here do not resolve tailscale names.
  ai-orchestration:
    container_name: e2e_ai_orchestration_fow
    build:
      context: ..
      dockerfile: ./apps/ai-orchestrator/Dockerfile
    ports:
      - '3010:3010'
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-100.89.87.124}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const socket=require(''net'').connect(3010, ''127.0.0.1''); socket.setTimeout(2000,()=>process.exit(1)); socket.on(''connect'',()=>process.exit(0)); socket.on(''error'',()=>process.exit(1));"',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    container_name: e2e_gateway_fow
    build:
      context: ..
      dockerfile: ./apps/gateway/Dockerfile
    ports:
      - '3000:3000'
    # Probes a route that exists, is unauthenticated, and needs no downstream
    # service, so a pass means Nest booted and is routing. This used to probe
    # /api/mcp/sse: the MCP transport is mapped at /api/sse, that path has never
    # existed, and the real one answers 401 anyway. The gateway could therefore
    # never become healthy, and anything waiting on it never started.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://127.0.0.1:3000/api/personalities'', (response) => process.exit(response.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1));"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: postgres
      JWT_SECRET: e2e-test-jwt-secret
      NODE_ENV: test
      OAUTH_STATE_SECRET: e2e-oauth-state-secret
      APP_SCOPE_ORIGINS: '{"forgeofwill":"http://forgeofwill.localhost:8081"}'
      CORS_ALLOWED_ORIGINS: http://forgeofwill.localhost:8081
      CLIENT_INTERFACE_UI_BASE_URL: http://forgeofwill.localhost:8081
      CLIENT_INTERFACE_DOMAIN: forgeofwill.localhost
      GOOGLE_CLIENT_ID: e2e-google-client-id
      GOOGLE_CLIENT_SECRET: e2e-google-client-secret
      GOOGLE_REDIRECT_URI: http://forgeofwill.localhost:8081/api/oauth/callback/google
      GOOGLE_AUTHORIZATION_ENDPOINT: http://127.0.0.1:3016/authorize
      GOOGLE_TOKEN_ENDPOINT: http://oauth-provider:3016/token
      GOOGLE_USER_INFO_ENDPOINT: http://oauth-provider:3016/userinfo
      AUTHENTICATION_HOST: authentication
      AUTHENTICATION_PORT: 3001
      PROFILE_HOST: profile
      PROFILE_PORT: 3002
      SOCIAL_HOST: social
      SOCIAL_PORT: 3003
      PROJECT_PLANNING_HOST: project-planning
      PROJECT_PLANNING_PORT: 3006
      CHAT_COLLECTOR_HOST: chat-collector
      CHAT_COLLECTOR_PORT: 3007
      FORUM_HOST: forum
      FORUM_PORT: 3015
      PERMISSIONS_HOST: permissions
      PERMISSIONS_PORT: 3012
      AI_ORCHESTRATION_HOST: ai-orchestration
      AI_ORCHESTRATION_PORT: 3010
    depends_on:
      db:
        condition: service_healthy
      authentication:
        condition: service_healthy
      profile:
        condition: service_healthy
      social:
        condition: service_started
      project-planning:
        condition: service_healthy
      chat-collector:
        condition: service_started
      forum:
        condition: service_started
      permissions:
        condition: service_healthy
      permissions-seed:
        condition: service_completed_successfully
      ai-orchestration:
        condition: service_healthy

  oauth-provider:
    image: cjrutherford/optimistic_tanuki_oauth-provider:${E2E_IMAGE_TAG:-latest}
    container_name: e2e_oauth_provider_fow
    build:
      context: ..
      dockerfile: ./e2e/oauth-provider/Dockerfile
    ports:
      - '3016:3016'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const socket=require(''net'').connect(3016, ''127.0.0.1''); socket.setTimeout(2000,()=>process.exit(1)); socket.on(''connect'',()=>process.exit(0)); socket.on(''error'',()=>process.exit(1));"',
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  forgeofwill-client-interface:
    container_name: e2e_fow_client_interface
    build:
      context: ..
      dockerfile: ./apps/forgeofwill/Dockerfile
    ports:
      - '8081:4000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:4000/'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      gateway:
        condition: service_healthy
      oauth-provider:
        condition: service_started

  playwright-runner:
    image: mcr.microsoft.com/playwright:v1.60.0-jammy
    container_name: e2e_runner_fow
    network_mode: host
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - /workspace/node_modules
    environment:
      BASE_URL: http://forgeofwill.localhost:8081
      CI: 'true'
      NX_DAEMON: 'false'
    depends_on:
      forgeofwill-client-interface:
        condition: service_started
    command: /bin/bash -c "echo 'Ready to run tests'"
