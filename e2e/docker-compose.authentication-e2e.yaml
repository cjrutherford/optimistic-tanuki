# Docker Compose for Authentication E2E Tests
# Minimal setup for testing authentication microservice
services:
  db:
    image: postgres:latest
    restart: always
    ports:
      - '127.0.0.1:${E2E_DB_PORT:-5439}:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  db-setup:
    build:
      context: ..
      dockerfile: ./docker/db-setup/Dockerfile
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      ADDITIONAL_DBS: ot_authentication,ot_profile,ot_permissions,ot_social,ot_forum
    depends_on:
      db:
        condition: service_healthy
    command: /bin/sh -c "command -v pg_isready && sh ./scripts/setup-and-migrate.sh"
    restart: 'no'

  authentication:
    build:
      context: ..
      dockerfile: ./apps/authentication/Dockerfile
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ot_authentication
      JWT_SECRET: e2e-test-jwt-secret
      AUTH_AUTO_VERIFY_EMAILS: 'true'
      SERVICE_PROFILE_HOST: profile
      SERVICE_PROFILE_PORT: 3002
      SERVICE_PERMISSIONS_HOST: permissions
      SERVICE_PERMISSIONS_PORT: 3012
      SERVICE_SOCIAL_HOST: social
      SERVICE_SOCIAL_PORT: 3003
      SERVICE_FORUM_HOST: forum
      SERVICE_FORUM_PORT: 3015
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  profile:
    build:
      context: ..
      dockerfile: ./apps/profile/Dockerfile
    volumes:
      - ../apps/profile/src/assets/config.yaml:/usr/src/app/assets/config.yaml:ro
    ports:
      - '127.0.0.1:3002:3002'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_profile
      SERVICE_AUTHENTICATION_HOST: authentication
      SERVICE_AUTHENTICATION_PORT: 3001
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      authentication:
        condition: service_started

  permissions:
    build:
      context: ..
      dockerfile: ./apps/permissions/Dockerfile
    ports:
      - '127.0.0.1:3012:3012'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_permissions
      SERVICE_AUTHENTICATION_HOST: authentication
      SERVICE_AUTHENTICATION_PORT: 3001
      SERVICE_PROFILE_HOST: profile
      SERVICE_PROFILE_PORT: 3002
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      authentication:
        condition: service_started
      profile:
        condition: service_started

  social:
    build:
      context: ..
      dockerfile: ./apps/social/Dockerfile
    volumes:
      - ../apps/social/src/assets/config.yaml:/usr/src/app/assets/config.yaml:ro
    ports:
      - '127.0.0.1:3003:3003'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_social
      SERVICE_AUTHENTICATION_HOST: authentication
      SERVICE_AUTHENTICATION_PORT: 3001
      SERVICE_PROFILE_HOST: profile
      SERVICE_PROFILE_PORT: 3002
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      authentication:
        condition: service_started
      profile:
        condition: service_started

  forum:
    build:
      context: ..
      dockerfile: ./apps/forum/Dockerfile
    ports:
      - '127.0.0.1:3015:3015'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_forum
      SERVICE_AUTHENTICATION_HOST: authentication
      SERVICE_AUTHENTICATION_PORT: 3001
      SERVICE_PROFILE_HOST: profile
      SERVICE_PROFILE_PORT: 3002
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      authentication:
        condition: service_started
      profile:
        condition: service_started
