# Shared E2E Infrastructure Stack
# Single stack used by all e2e test suites - start once, run all tests sequentially
services:
  # ──────────────── Infrastructure ────────────────
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '${E2E_DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    restart: always
    ports:
      - '${E2E_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  db-setup:
    build:
      context: ..
      dockerfile: ./docker/db-setup/Dockerfile
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # Use the default ADDITIONAL_DBS from setup-and-migrate.sh which includes all service DBs
    depends_on:
      db:
        condition: service_healthy
    command: /bin/sh -c "command -v pg_isready && sh ./scripts/setup-and-migrate.sh"
    restart: 'no'

  # ──────────────── Backend Microservices ────────────────
  authentication:
    image: cjrutherford/optimistic_tanuki_authentication:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/authentication/Dockerfile
    ports:
      - '3001:3001'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_authentication
      AUTH_AUTO_VERIFY_EMAILS: 'true'
      JWT_SECRET: e2e-test-jwt-secret
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  profile:
    image: cjrutherford/optimistic_tanuki_profile:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/profile/Dockerfile
    ports:
      - '3002:3002'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_profile
      SERVICE_PERMISSIONS_HOST: permissions
      SERVICE_PERMISSIONS_PORT: 3012
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  social:
    image: cjrutherford/optimistic_tanuki_social:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/social/Dockerfile
    ports:
      - '3003:3003'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_social
      SERVICE_AUTHENTICATION_HOST: authentication
      SERVICE_AUTHENTICATION_PORT: 3001
      SERVICE_PROFILE_HOST: profile
      SERVICE_PROFILE_PORT: 3002
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  assets:
    image: cjrutherford/optimistic_tanuki_assets:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/assets/Dockerfile
    ports:
      - '3005:3005'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_assets
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  project-planning:
    image: cjrutherford/optimistic_tanuki_project-planning:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/project-planning/Dockerfile
    ports:
      - '3006:3006'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_project_planning
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  chat-collector:
    image: cjrutherford/optimistic_tanuki_chat-collector:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/chat-collector/Dockerfile
    ports:
      - '3007:3007'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_chat_collector
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  # fin-commander-e2e drives /api/finance, which the gateway forwards to this
  # service. It was never part of this composition, so those calls had nothing
  # behind them. No host port is published: only the gateway talks to it, over
  # the compose network, and 3016 on the host already belongs to
  # oauth-provider.
  finance:
    image: cjrutherford/optimistic_tanuki_finance:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/finance/Dockerfile
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_finance
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const socket=require('net').connect(3016,'127.0.0.1'); socket.setTimeout(2000,()=>process.exit(1)); socket.on('connect',()=>process.exit(0)); socket.on('error',()=>process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  forum:
    image: cjrutherford/optimistic_tanuki_forum:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/forum/Dockerfile
    ports:
      - '3015:3015'
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ot_forum
      PORT: 3015
      SEED_DEMO_DATA: 'true'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const socket=require('net').connect(3015,'127.0.0.1'); socket.setTimeout(2000,()=>process.exit(1)); socket.on('connect',()=>process.exit(0)); socket.on('error',()=>process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  telos-docs-service:
    image: cjrutherford/optimistic_tanuki_telos-docs-service:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/telos-docs-service/Dockerfile
    ports:
      - '3008:3008'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_telos_docs_service
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  prompt-proxy:
    image: cjrutherford/optimistic_tanuki_prompt-proxy:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/prompt-proxy/Dockerfile
    ports:
      - '3009:3009'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: postgres
    volumes:
      - ../apps/prompt-proxy/src/assets/config.yaml:/usr/src/assets/config.yaml
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  ai-orchestrator:
    image: cjrutherford/optimistic_tanuki_ai-orchestrator:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/ai-orchestrator/Dockerfile
    ports:
      - '3010:3010'
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TELEOS_DOCS_URL: http://telos-docs-service:3008
      MCP_URL: http://gateway:3000/api/mcp
      # Ollama is not available in CI - AI model features are disabled in e2e stack
      OLLAMA_HOST: ''
      OLLAMA_PORT: 11434
    depends_on:
      redis:
        condition: service_healthy
      telos-docs-service:
        condition: service_started
      chat-collector:
        condition: service_started
      project-planning:
        condition: service_started

  blogging:
    image: cjrutherford/optimistic_tanuki_blogging:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/blogging/Dockerfile
    ports:
      - '3011:3011'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_blogging
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  permissions:
    image: cjrutherford/optimistic_tanuki_permissions:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/permissions/Dockerfile
    ports:
      - '3012:3012'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_permissions
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  permissions-seed:
    image: cjrutherford/optimistic_tanuki_permissions:${E2E_IMAGE_TAG:-latest}
    command: ['node', './seed-permissions.js']
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_permissions
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    restart: 'no'

  store:
    image: cjrutherford/optimistic_tanuki_store:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/store/Dockerfile
    ports:
      - '3013:3013'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_store
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  # The store catalog is empty without this. seed-store.js is already built as
  # an additional entry point in apps/store/webpack.config.js; it just was
  # never wired into the e2e stack, so every store-client catalog assertion
  # had nothing to render.
  store-seed:
    image: cjrutherford/optimistic_tanuki_store:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/store/Dockerfile
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_store
    depends_on:
      store:
        condition: service_started
    command: ['node', './seed-store.js']
    restart: 'no'

  app-configurator:
    image: cjrutherford/optimistic_tanuki_app-configurator:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/app-configurator/Dockerfile
    ports:
      - '3014:3014'
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ot_app_configurator
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3014
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  app-configurator-seed:
    image: cjrutherford/optimistic_tanuki_app-configurator:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/app-configurator/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ot_app_configurator
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3014
    depends_on:
      app-configurator:
        condition: service_started
    command: sh -c "sleep 5 && node seed-data/seed-script.js"
    restart: 'no'

  lead-tracker:
    image: cjrutherford/optimistic_tanuki_lead-tracker:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/lead-tracker/Dockerfile
    ports:
      - '3020:3020'
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ot_lead_tracker
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  gateway:
    image: cjrutherford/optimistic_tanuki_gateway:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/gateway/Dockerfile
    ports:
      - '3000:3000'
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: postgres
      NODE_ENV: test
      # Credential routes keep strict production defaults. E2E creates multiple
      # independent accounts from one browser source, so raise only this
      # isolated-stack override rather than weakening deployed throttles.
      THROTTLE_LOGIN_LIMIT: 100
      JWT_SECRET: e2e-test-jwt-secret
      OAUTH_STATE_SECRET: e2e-oauth-state-secret
      # These must match the origin the suites actually drive. Every UI target
      # in scripts/e2e-environment-manifest.mjs uses a 127.0.0.1 baseUrl, but
      # tools/registry/apps.yaml declares every app on `localhost` (correct for
      # local development), and OAuth matches origins exactly. The gateway
      # therefore redirected each popup back to a different origin than its
      # opener, and the suites timed out waiting for a callback that arrived
      # somewhere else. CORS_ALLOWED_ORIGINS lists both spellings, which is why
      # nothing but OAuth noticed.
      #
      # APP_SCOPE_ORIGINS is the gateway's designed per-environment override:
      # resolveCallbackBase() consults it before the registry, so the registry
      # stays correct for development while CI pins the loopback origins it
      # actually serves. Keep in step with the manifest's UI baseUrls.
      APP_SCOPE_ORIGINS: '{"client-interface":"http://127.0.0.1:8080","forgeofwill":"http://127.0.0.1:8081","digital-homestead":"http://127.0.0.1:8082","christopherrutherford-net":"http://127.0.0.1:8083","owner-console":"http://127.0.0.1:8084","store":"http://127.0.0.1:8085","fin-commander":"http://127.0.0.1:8089","configurable-client":"http://127.0.0.1:8090","learning":"http://127.0.0.1:8099"}'
      CLIENT_INTERFACE_UI_BASE_URL: http://127.0.0.1:8080
      CLIENT_INTERFACE_DOMAIN: 127.0.0.1
      CI_GOOGLE_CLIENT_ID: e2e-google-client-id
      CI_GOOGLE_CLIENT_SECRET: e2e-google-client-secret
      CI_GOOGLE_AUTHORIZATION_ENDPOINT: http://127.0.0.1:3016/authorize
      CI_GOOGLE_TOKEN_ENDPOINT: http://oauth-provider:3016/token
      CI_GOOGLE_USER_INFO_ENDPOINT: http://oauth-provider:3016/userinfo
      GOOGLE_CLIENT_ID: e2e-google-client-id
      GOOGLE_CLIENT_SECRET: e2e-google-client-secret
      GOOGLE_AUTHORIZATION_ENDPOINT: http://127.0.0.1:3016/authorize
      GOOGLE_TOKEN_ENDPOINT: http://oauth-provider:3016/token
      GOOGLE_USER_INFO_ENDPOINT: http://oauth-provider:3016/userinfo
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:8081,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://localhost:8085,http://localhost:8089,http://localhost:8090,http://127.0.0.1:8080,http://127.0.0.1:8081,http://127.0.0.1:8082,http://127.0.0.1:8083,http://127.0.0.1:8084,http://127.0.0.1:8085,http://127.0.0.1:8089,http://127.0.0.1:8090,http://localhost:8099,http://127.0.0.1:8099
      AUTHENTICATION_HOST: authentication
      AUTHENTICATION_PORT: 3001
      PROFILE_HOST: profile
      PROFILE_PORT: 3002
      SOCIAL_HOST: social
      SOCIAL_PORT: 3003
      ASSET_HOST: assets
      ASSET_PORT: 3005
      PROJECT_PLANNING_HOST: project-planning
      PROJECT_PLANNING_PORT: 3006
      CHAT_COLLECTOR_HOST: chat-collector
      CHAT_COLLECTOR_PORT: 3007
      FORUM_HOST: forum
      FORUM_PORT: 3015
      BLOGGING_HOST: blogging
      BLOGGING_PORT: 3011
      # apps/gateway/src/assets/config.yaml points learning_service at the
      # production container name `ot_learning_service` rather than the plain
      # service name every other entry uses, so without this override the
      # gateway cannot resolve it here: `getaddrinfo EAI_AGAIN
      # ot_learning_service`, surfacing as a 500 where the suite expects a 404.
      LEARNING_SERVICE_HOST: learning-service
      LEARNING_SERVICE_PORT: 3024
      PERMISSIONS_HOST: permissions
      PERMISSIONS_PORT: 3012
      STORE_HOST: store
      STORE_PORT: 3013
      APP_CONFIGURATOR_HOST: app-configurator
      APP_CONFIGURATOR_PORT: 3014
      LEAD_TRACKER_HOST: lead-tracker
      LEAD_TRACKER_PORT: 3020
    depends_on:
      db:
        condition: service_healthy
      authentication:
        condition: service_started
      profile:
        condition: service_started
      social:
        condition: service_started
      assets:
        condition: service_started
      blogging:
        condition: service_started
      permissions:
        condition: service_started
      store:
        condition: service_started
      forum:
        condition: service_started
      app-configurator:
        condition: service_started
      lead-tracker:
        condition: service_started

  oauth-provider:
    # An explicit tag keeps batched CI builds and project-scoped Compose runs
    # aligned; without it Compose derives a project-specific image name that
    # Docker Bake does not produce.
    image: cjrutherford/optimistic_tanuki_oauth-provider:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./e2e/oauth-provider/Dockerfile
    ports:
      - '3016:3016'

  # ──────────────── UI Apps (for UI e2e tests) ────────────────
  # Each UI app is started selectively during its test suite via --profile
  client-interface:
    # The shared OAuth callback proxy is required by each cookie-session
    # client, so include it whenever those app profiles are started.
    profiles: [client-interface, forgeofwill, fin-commander, digital-homestead]
    image: cjrutherford/optimistic_tanuki_client-interface:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/client-interface/Dockerfile
    ports:
      - '8080:4000'
    depends_on:
      gateway:
        condition: service_started

  # ──────────────── Let's Go ────────────────
  # Behind a profile, so nothing here starts for another app's suite. The
  # runner sits on an internal network with no route out: it executes code
  # a stranger submitted.
  learning-runner:
    profiles: [learning]
    # Every other service here names its published image. This one only had a
    # `build:`, and CI pulls the manifest's services and then brings them up
    # with `--no-build`, so learning-runner could neither be pulled nor
    # created and the whole learning stack failed to start — only `db` was
    # left standing. db-setup and oauth-provider are the deliberate
    # build-locally exceptions and are excluded from the pull list; this is
    # not one of them. The image is built and published by the same
    # Image Check / Publish Images matrix as its siblings.
    image: cjrutherford/optimistic_tanuki_learning-runner:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/learning-runner/Dockerfile
    environment:
      PORT: 3025
    networks: [learning-internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    mem_limit: 1g
    tmpfs:
      - /scratch:exec,size=512m

  learning-service:
    profiles: [learning]
    image: cjrutherford/optimistic_tanuki_learning-service:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/learning-service/Dockerfile
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: ot_learning_service
      LEARNING_CONTENT_ROOT: /usr/src/app/assets/content
      LEARNING_RUNNER_URL: http://learning-runner:3025
      # Marking written answers. Unset in CI, where there is no model to ask,
      # and an answer that cannot be marked is recorded rather than lost.
      LEARNING_OLLAMA_URL: ${LEARNING_OLLAMA_URL:-}
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    networks: [default, learning-internal]

  learning:
    profiles: [learning]
    image: cjrutherford/optimistic_tanuki_learning:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/learning/Dockerfile
    ports:
      - '8099:4000'
    depends_on:
      gateway:
        condition: service_started

  forgeofwill:
    profiles: [forgeofwill]
    image: cjrutherford/optimistic_tanuki_forgeofwill:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/forgeofwill/Dockerfile
    ports:
      - '8081:4000'
    depends_on:
      gateway:
        condition: service_started

  fin-commander:
    profiles: [fin-commander]
    image: cjrutherford/optimistic_tanuki_fin-commander:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/fin-commander/Dockerfile
    ports:
      - '8089:4000'
    depends_on:
      gateway:
        condition: service_started

  digital-homestead:
    profiles: [digital-homestead]
    image: cjrutherford/optimistic_tanuki_digital-homestead:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/digital-homestead/Dockerfile
    ports:
      - '8082:4000'
    depends_on:
      gateway:
        condition: service_started

  christopherrutherford-net:
    profiles: [christopherrutherford-net]
    image: cjrutherford/optimistic_tanuki_christopherrutherford-net:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/christopherrutherford-net/Dockerfile
    ports:
      - '8083:4000'
    depends_on:
      gateway:
        condition: service_started

  owner-console:
    profiles: [owner-console]
    image: cjrutherford/optimistic_tanuki_owner-console:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/owner-console/Dockerfile
    ports:
      - '8084:4000'
    depends_on:
      gateway:
        condition: service_started

  store-client:
    profiles: [store-client]
    image: cjrutherford/optimistic_tanuki_store-client:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/store-client/Dockerfile
    ports:
      - '8085:4000'
    environment:
      PORT: 4000
    depends_on:
      gateway:
        condition: service_started

  configurable-client:
    profiles: [configurable-client]
    image: cjrutherford/optimistic_tanuki_configurable-client:${E2E_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: ./apps/configurable-client/Dockerfile
    ports:
      - '8090:4000'
    environment:
      GATEWAY_URL: http://gateway:3000
    depends_on:
      gateway:
        condition: service_started
      app-configurator:
        condition: service_started

networks:
  default:
  # No route out. The learning runner executes code a stranger submitted, so
  # the container boundary is the security boundary.
  learning-internal:
    internal: true
