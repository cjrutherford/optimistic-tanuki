@if (isBrowser) {
<div class="motion-background" aria-hidden="true">
  <otui-personality-scene
    height="100vh"
    fallbackScene="topographic-drift"
    [density]="6"
    [speed]="0.22"
    [intensity]="0.34"
  ></otui-personality-scene>
</div>
}

<div class="app-content">
  <router-outlet></router-outlet>
  <hai-about-tag
    class="about-app-utility"
    [config]="haiAboutConfig"
  ></hai-about-tag>
</div>
