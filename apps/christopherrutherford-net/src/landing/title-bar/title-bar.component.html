<otui-app-bar
  appTitle="Christopher Rutherford"
  logoSrc="assets/images/tanuki-mark.webp"
  logoAlt="Christopher Rutherford tanuki mark"
  [showThemeToggle]="false"
  [useTile]="true"
  density="compact"
  menuIcon="☰"
  (menuToggle)="toggleMenu()"
>
</otui-app-bar>

<otui-nav-sidebar
  [isOpen]="menuOpen()"
  [navItems]="navItems"
  heading="Navigation"
  (close)="menuOpen.set(false)"
>
</otui-nav-sidebar>
