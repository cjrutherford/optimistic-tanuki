    <span class="hero-kicker"
      >Independent systems architect and product engineer</span
    >
    <lib-hero
      [title]="'Christopher Rutherford'"
      [subtitle]="
        'I design and build dependable software systems, from product architecture through the details people use every day.'
      "
      [description]="
        'I work with teams to turn complex product and platform problems into clear architecture, useful interfaces, and software that stays understandable as it grows.'
