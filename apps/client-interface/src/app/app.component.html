<lib-personality-backdrop />

@if (isBrowser) {
<div class="motion-background" aria-hidden="true">
  <otui-personality-scene
    height="100vh"
    fallbackScene="flock-field"
    [density]="5"
    [speed]="0.3"
    [intensity]="0.7"
  ></otui-personality-scene>
</div>
}

<div class="app-content">
  <div class="container">
    <otui-app-bar
      appTitle="Optimistic Tanuki"
      logoSrc="assets/tanuki-icon.png"
      logoAlt="Optimistic Tanuki Logo"
      [showThemeToggle]="true"
      [useTile]="false"
      (menuToggle)="toggleNav()"
    >
      <search-global-search (searchResultClick)="onSearchResultClick($event)" />
    </otui-app-bar>

    <otui-nav-sidebar
      [isOpen]="isNavExpanded()"
      [navItems]="navItems()"
      heading="Navigation"
      (close)="isNavExpanded.set(false)"
    >
    </otui-nav-sidebar>

    <main class="content">
      @if (isAuthenticated() && !suppressFixedChatOverlays()) {
      <div class="chat-launcher-row">
        <button
          #chatLauncher
          type="button"
          class="chat-floating-button"
          aria-label="Messages"
          aria-controls="floating-chat-panel"
          [attr.aria-expanded]="showChat()"
          (click)="toggleChat()"
        >
          <span class="chat-icon" aria-hidden="true">💬</span>
          <span class="chat-label">Messages</span>
        </button>
      </div>

      <section
        #chatPanel
        id="floating-chat-panel"
        class="chat-panel"
        role="region"
        aria-labelledby="floating-chat-title"
        tabindex="-1"
        [hidden]="!showChat()"
        (keydown.escape)="closeChat()"
      >
        <header class="chat-panel-header">
          <h2 id="floating-chat-title">Messages</h2>
          <button
            type="button"
            class="chat-panel-close"
            aria-label="Close messages"
            (click)="closeChat()"
          >
            <span aria-hidden="true">×</span>
          </button>
        </header>
        <div class="chat-panel-content">
          @if (chatEverOpened()) {
          <lib-chat-ui
            [contacts]="chatContacts"
            [conversations]="chatConversations"
            [currentUserId]="selectedProfile()?.id || ''"
            [conversationToOpen]="conversationToOpen()"
            (messageSubmitted)="handleFloatingMessageSubmitted($event)"
          ></lib-chat-ui>
          }
        </div>
      </section>
      } @if (workspaceSummary(); as summary) {
      <section class="workflow-summary">
        <p class="workflow-kicker">{{ summary.eyebrow }}</p>
        <h1>{{ summary.title }}</h1>
        <p>{{ summary.description }}</p>
      </section>
      }
      <router-outlet></router-outlet>
    </main>

    @if (isAuthenticated()) {
    <notif-notification-bell
      class="notification-bell"
      [notifications]="notifications"
      [unreadCount]="unreadCount"
      (notificationClick)="onNotificationClick($event)"
      (markAllRead)="onMarkAllRead()"
    ></notif-notification-bell>

    <otui-dev-info />

    <lib-message />
    } @if (!suppressFixedChatOverlays()) {
    <hai-about-tag [config]="haiAboutConfig" placement="inline"></hai-about-tag>
    }
    <lib-bug-report-ui />
    <otui-public-info-footer
      [accountRightsAvailable]="true"
      [productName]="haiAboutConfig.appName"
      [tagline]="publicFooterTagline"
    />
  </div>
</div>
