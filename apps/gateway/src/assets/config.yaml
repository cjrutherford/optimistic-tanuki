# The confidential vault's model path.
#
# `ollama.baseUrl` is deliberately empty in source. It used to be a hardcoded
# tailnet address, which made the air gap a fact about one machine: change the
# box and the boundary moved with it, and nothing in the code would have said so.
# The endpoint now comes from VAULT_OLLAMA_BASE_URL, and when it is unset the
# vault tools refuse the request rather than falling back to a default host.
#
# The air gap is enforced, not documented: on every call the endpoint has to
# resolve to a loopback, private, link-local, or carrier-grade-NAT address, and
# redirects are refused, so a prompt cannot be replayed to another host on the
# way out. See apps/gateway/src/app/mcp/air-gap/local-endpoint.guard.ts.
vault:
  ollama:
    # No host in source. Set VAULT_OLLAMA_BASE_URL to the on-premises Ollama
    # endpoint, e.g. http://ollama:11434 or http://127.0.0.1:11434.
    baseUrl: ''
  model:
    # The model the vault path uses. qwen2.5-coder:14b is what the slice
    # specification names for transcript and tax schedule parsing; it is a
    # default rather than a constant, and VAULT_OLLAMA_MODEL overrides it.
    name: 'qwen2.5-coder:14b'
    # How much the model may read, in tokens. The measured rule in this
    # workspace is that usable prompt is roughly half of num_ctx, so a retrieved
    # passage set larger than about 16k tokens will be truncated at the oldest
    # end without saying so.
    numCtx: 32768
    temperature: 0.1
    timeoutMs: 60000

auth:
  jwtSecret: |
    c3VwZXJzZWNyZXRzdHJpbmc=

# Lemon Squeezy webhook signing secret. Leave empty in source; the
# LEMON_SQUEEZY_WEBHOOK_SECRET environment variable supplies the real value.
# Webhooks are rejected (fail closed) when this is not configured.
payments:
  webhookSecret: ${LEMON_SQUEEZY_WEBHOOK_SECRET}

# Shared OAuth bridge credentials. Built-in defaults supply provider endpoints
# and scopes; unresolved placeholders are treated as missing so non-empty
# environment values can provide the final override.
oauth:
  google:
    clientId: ${GOOGLE_CLIENT_ID}
    clientSecret: ${GOOGLE_CLIENT_SECRET}
    redirectUri: ${GOOGLE_REDIRECT_URI}
  github:
    clientId: ${GITHUB_CLIENT_ID}
    clientSecret: ${GITHUB_CLIENT_SECRET}
    redirectUri: ${GITHUB_REDIRECT_URI}
  microsoft:
    clientId: ${MICROSOFT_CLIENT_ID}
    clientSecret: ${MICROSOFT_CLIENT_SECRET}
    redirectUri: ${MICROSOFT_REDIRECT_URI}
  facebook:
    clientId: ${FACEBOOK_CLIENT_ID}
    clientSecret: ${FACEBOOK_CLIENT_SECRET}
    redirectUri: ${FACEBOOK_REDIRECT_URI}

# Permissions cache configuration
# Provider options: memory, file, redis
permissions:
  cache:
    provider: memory # Use 'file' for persistent cache or 'redis' for distributed cache
    ttl: 300000 # Cache TTL in milliseconds (5 minutes)
    maxSize: 10000 # Maximum cache entries (for memory/file providers)

contactLeads:
  appScopes:
    hai:
      sourceLabel: HAI
    christopherrutherford-net:
      sourceLabel: Christopher Rutherford Net
    digital-homestead:
      sourceLabel: Digital Homestead
    business-site:
      sourceLabel: Business Site

    # File-based cache configuration (only used when provider is 'file')
    # cacheDir: /tmp/permissions-cache

    # Redis cache configuration (only used when provider is 'redis')
    # redis:
    #   host: localhost
    #   port: 6379
    #   password: your-redis-password  # Optional
    #   db: 0                          # Redis database number
    #   keyPrefix: 'permissions:'      # Key prefix for cache entries
