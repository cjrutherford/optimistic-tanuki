<lib-personality-backdrop />

@if (isBrowser) {
<div class="motion-background" aria-hidden="true">
  <otui-personality-scene
    height="100vh"
    fallbackScene="aurora-ribbon"
    [density]="4"
    [speed]="0.26"
    [intensity]="0.38"
  ></otui-personality-scene>
</div>
}

<div class="app-content">
  <a class="skip-link" href="#main-content" (click)="skipToContent($event)"
    >Skip to content</a
  >
  <hai-title-bar></hai-title-bar>
  <main class="page" id="main-content" tabindex="-1">
    <router-outlet></router-outlet>
    <hai-contact-strip></hai-contact-strip>
  </main>
  <hai-about-tag [config]="haiAboutConfig"></hai-about-tag>
</div>
