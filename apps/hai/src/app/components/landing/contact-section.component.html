<section
  class="contact-panel"
  data-theme-surface="hero"
  data-tone="brand"
  data-emphasis="soft"
  data-size="lg"
  id="contact"
>
  <p class="eyebrow">{{ contactLead.title }}</p>
  <h2>{{ contactLead.description }}</h2>
  <p class="sla-notice" role="note">
    Hopeful Aspirations Industries will personally acknowledge your message
    within one business hour, counted Monday–Friday, 9 a.m.–5 p.m. Eastern.
    Service timing depends on the work requested.
  </p>
  <lib-contact-form
    [bannerImage]="'assets/contact-office-shelf.webp'"
    [title]="'Start a project with HAI'"
    [buttonText]="submittingContact ? 'Sending…' : 'Send Message'"
    [subjects]="contactSubjects"
    [initialMessage]="contactPrefill"
    (formSubmit)="formSubmit.emit($event)"
  ></lib-contact-form>
  @if (contactStatus) {
  <p class="contact-status" aria-live="polite">{{ contactStatus }}</p>
  }
</section>
