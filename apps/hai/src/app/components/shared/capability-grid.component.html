<section
  class="capabilities"
  [id]="sectionId"
  [attr.aria-labelledby]="sectionId + '-heading'"
>
  <p class="eyebrow">{{ eyebrow }}</p>
  <h2 [id]="sectionId + '-heading'">{{ heading }}</h2>

  <ul
    class="capability-list"
    [class.three-up]="capabilities.length === 3"
    [style.--grid-columns]="columns"
  >
    @for (capability of capabilities; track capability.title) {
    <li>
      <otui-card
        class="capability-card"
        CardVariant="default"
        tone="neutral"
        emphasis="soft"
      >
        <h3>{{ capability.title }}</h3>
        <p>{{ capability.description }}</p>
      </otui-card>
    </li>
    }
  </ul>

  @if (qualifier) {
  <p class="qualifier">{{ qualifier }}</p>
  }
</section>
