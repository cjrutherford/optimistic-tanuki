<header class="hai-header" role="banner">
  <div class="header-container">
    <a
      routerLink="/"
      class="brand-link"
      aria-label="HOPEFUL ASPIRATIONS INDUSTRIES Home"
    >
      <img
        src="assets/haidev-logo.png"
        alt="HOPEFUL ASPIRATIONS INDUSTRIES"
        class="brand-logo"
        width="44"
        height="47"
      />
      <span class="brand-title">HOPEFUL ASPIRATIONS INDUSTRIES</span>
    </a>

    <nav class="desktop-nav" aria-label="Main navigation">
      @for (item of headerLinks; track item.label) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        class="nav-link"
      >
        {{ item.label }}
      </a>
      }
    </nav>

    <div class="header-actions">
      <a routerLink="/contact" class="header-cta-btn">Schedule Free Audit</a>

      <lib-theme-toggle></lib-theme-toggle>

      <button
        type="button"
        class="menu-btn"
        (click)="toggleMenu()"
        aria-label="Open site navigation"
        [attr.aria-expanded]="menuOpen()"
      >
        <span aria-hidden="true">☰</span>
        <span class="menu-label">Menu</span>
      </button>
    </div>
  </div>
</header>

<otui-nav-sidebar
  [isOpen]="menuOpen()"
  [navItems]="navItems()"
  heading="Navigate HAI"
  (close)="menuOpen.set(false)"
>
</otui-nav-sidebar>
