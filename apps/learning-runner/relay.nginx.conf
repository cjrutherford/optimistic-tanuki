pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
  access_log /dev/stdout;
  proxy_temp_path /tmp/proxy_temp;
  # The relay container is read-only with only /tmp as tmpfs: every spool
  # path must live under /tmp or nginx dies at boot (temp paths default to
  # /var/cache/nginx, which is read-only; nginx creates all of them at boot
  # even when unused).
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 3025;
    server_tokens off;
    client_max_body_size 1m;

    location = /runs {
      limit_except POST {
        deny all;
      }
      proxy_pass http://learning-runner:3025;
      proxy_request_buffering on;
      proxy_connect_timeout 2s;
      proxy_send_timeout 5s;
      proxy_read_timeout 70s;
    }

    location / {
      return 404;
    }
  }
}
