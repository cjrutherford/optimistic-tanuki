<div class="dashboard-container">
  <otui-app-bar
    appTitle="Owner Console"
    [showThemeToggle]="true"
    [useTile]="false"
    (menuToggle)="toggleSidebar()"
    logoSrc="/tempest-in-a-teacup.png"
    logoAlt="Owner Console Logo"
  >
    <app-town-switcher></app-town-switcher>
    <button
      type="button"
      class="bar-button search-button"
      aria-haspopup="dialog"
      aria-keyshortcuts="Control+K Meta+K"
      (click)="openPalette()"
    >
      Search pages <kbd>Ctrl K</kbd>
    </button>
    <button
      type="button"
      class="bar-button"
      (click)="toggleTheme()"
      [attr.aria-label]="themeToggleLabel"
    >
      {{ themeToggleLabel }}
    </button>
    <button type="button" class="bar-button" (click)="logout()">
      Sign out
    </button>
  </otui-app-bar>

  <div class="shell">
    <app-owner-sidebar
      [groups]="groups()"
      [activePath]="activePath()"
      [townId]="town.selected()?.id ?? null"
      [open]="sidebarOpen()"
      [mode]="desktop() ? 'docked' : 'drawer'"
      (selected)="onNavigated()"
      (dismissed)="closeSidebar()"
    ></app-owner-sidebar>

    <div class="content">
      <app-owner-breadcrumbs
        [url]="url()"
        [town]="town.selected()"
      ></app-owner-breadcrumbs>
      @if (urlTownId(); as townId) { @if (town.notFound()) {
      <app-town-not-found [townId]="townId"></app-town-not-found>
      } @else {
      <app-town-tabs
        [townId]="townId"
        [activePath]="activePath()"
      ></app-town-tabs>
      <router-outlet></router-outlet>
      } } @else {
      <router-outlet></router-outlet>
      }
    </div>
  </div>

  <app-command-palette
    [open]="paletteOpen()"
    [entries]="paletteEntries()"
    (closed)="closePalette()"
    (chosen)="goTo($event)"
  ></app-command-palette>
</div>
