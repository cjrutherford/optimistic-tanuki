<div class="dashboard-container">
  <otui-app-bar
    appTitle="Owner Console"
    [showThemeToggle]="true"
    [useTile]="false"
    (menuToggle)="toggleSidebar()"
    logoSrc="/tempest-in-a-teacup.png"
    logoAlt="Owner Console Logo"
  >
    <button
      type="button"
      class="bar-button search-button"
      aria-haspopup="dialog"
      aria-keyshortcuts="Control+K Meta+K"
      (click)="openPalette()"
    >
      Search pages <kbd>Ctrl K</kbd>
    </button>
    <button
      type="button"
      class="bar-button"
      (click)="toggleTheme()"
      [attr.aria-label]="themeToggleLabel"
    >
      {{ themeToggleLabel }}
    </button>
    <button type="button" class="bar-button" (click)="logout()">
      Sign out
    </button>
  </otui-app-bar>

  <div class="shell">
    <app-owner-sidebar
      [groups]="groups()"
      [activePath]="activePath()"
      [open]="sidebarOpen()"
      [mode]="desktop() ? 'docked' : 'drawer'"
      (selected)="onNavigated()"
      (dismissed)="closeSidebar()"
    ></app-owner-sidebar>

    <div class="content">
      <app-owner-breadcrumbs [url]="url()"></app-owner-breadcrumbs>
      <router-outlet></router-outlet>
    </div>
  </div>

  <app-command-palette
    [open]="paletteOpen()"
    [entries]="paletteEntries()"
    (closed)="closePalette()"
    (chosen)="goTo($event)"
  ></app-command-palette>
</div>
