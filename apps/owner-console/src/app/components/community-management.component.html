<section class="communities-page">
  <ot-owner-page-header
    title="Communities"
    description="Every community on the platform. Deleting one removes it for all of its members."
  >
    <otui-button ot-actions variant="primary" (action)="createNew()">
      Create community
    </otui-button>
  </ot-owner-page-header>

  @if (loadError) {
  <ot-owner-state
    kind="error"
    [message]="loadError"
    (retry)="loadCommunities()"
  />
  } @else if (loading) {
  <ot-owner-state kind="loading" message="Loading communities…" />
  } @else if (communities.length === 0) {
  <ot-owner-state
    kind="empty"
    message="No communities exist yet."
    actionLabel="Create community"
    (action)="createNew()"
  />
  } @else {
  <ot-owner-filter-bar
    label="Search communities"
    placeholder="Name or description"
    (query)="onSearch($event)"
    (cleared)="onSearch('')"
  >
    <label class="filter-field">
      <span class="filter-label">Join policy</span>
      <select
        class="filter-select"
        [(ngModel)]="filterJoinPolicy"
        (ngModelChange)="onFilterChange()"
      >
        @for (option of joinPolicyOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </label>
  </ot-owner-filter-bar>

  @if (filteredCommunities.length === 0) {
  <ot-owner-state kind="empty" message="No communities match." />
  } @else {
  <div class="community-grid">
    @for (community of filteredCommunities; track community.id) {
    <article class="community-card">
      <button
        type="button"
        class="community-card__open"
        (click)="editCommunity(community)"
        [attr.aria-label]="'Edit ' + community.name"
      >
        <h2>{{ community.name }}</h2>
        <p>{{ blurb(community.description) }}</p>
        <p><strong>Members:</strong> {{ community.memberCount ?? 0 }}</p>
        <p><strong>Join Policy:</strong> {{ community.joinPolicy }}</p>
      </button>
      <div class="community-actions">
        <otui-button variant="secondary" (click)="manageMembers(community)"
          >Members</otui-button
        >
        <otui-button
          variant="danger"
          (click)="deleteCommunity(community, $event)"
          >Delete</otui-button
        >
      </div>
    </article>
    }
  </div>
  } }
</section>
