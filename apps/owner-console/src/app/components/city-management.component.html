<section class="cities-page">
  <ot-owner-page-header
    title="Cities"
    description="City records are governed through Community Ops permissions on the shared communities API."
  >
    <otui-button ot-actions variant="primary" (action)="createNew()">
      Create city
    </otui-button>
  </ot-owner-page-header>

  @if (loadError) {
  <ot-owner-state kind="error" [message]="loadError" (retry)="loadCities()" />
  } @else if (loading) {
  <ot-owner-state kind="loading" message="Loading cities…" />
  } @else if (cities.length === 0) {
  <ot-owner-state
    kind="empty"
    message="No cities exist yet."
    actionLabel="Create city"
    (action)="createNew()"
  />
  } @else {
  <ot-owner-filter-bar
    label="Search cities"
    placeholder="Name, description or place"
    (query)="onSearch($event)"
    (cleared)="onSearch('')"
  >
    <label class="filter-field">
      <span class="filter-label">Type</span>
      <select
        class="filter-select"
        [(ngModel)]="filterLocalityType"
        (ngModelChange)="onFilterChange()"
      >
        @for (option of localityTypeOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </label>
  </ot-owner-filter-bar>

  @if (filteredCities.length === 0) {
  <ot-owner-state kind="empty" message="No cities match." />
  } @else {
  <div class="city-grid">
    @for (city of filteredCities; track city.id) {
    <article class="city-card">
      <button
        type="button"
        class="city-card__open"
        (click)="editCity(city)"
        [attr.aria-label]="'Edit ' + city.name"
      >
        <h2>{{ city.name }}</h2>
        <p>{{ blurb(city.description) }}</p>
        <p><strong>Population:</strong> {{ city.population | number }}</p>
        <p>
          <strong>Location:</strong>
          {{ place(city) }}
        </p>
      </button>
      <div class="city-actions">
        <otui-button variant="danger" (click)="deleteCity(city, $event)"
          >Delete</otui-button
        >
      </div>
    </article>
    }
  </div>
  } }
</section>
